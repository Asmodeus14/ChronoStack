# Redis and a Sidekiq worker. Nothing in here knows about ChronoStack.
name: sidekiq-trial

services:
  redis:
    image: redis:7.4-alpine

  sidekiq:
    build: .
    command: ["sidekiq", "-r", "./jobs.rb", "-c", "5"]
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
