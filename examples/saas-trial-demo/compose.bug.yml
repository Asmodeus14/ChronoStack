# A deliberate regression, for trying ChronoStack's failure reports:
# the worker treats ANY HTTP response, even a 503, as a delivered webhook.
#
#   chronostack -f compose.yml -f compose.bug.yml up --wait
#   chronostack run scenarios/trial.yml      # fails; read the report it writes
services:
  worker:
    environment:
      WEBHOOK_BUG: ignore-status
