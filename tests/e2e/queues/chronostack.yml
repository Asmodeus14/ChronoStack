version: 1
advance: { barrier_timeout: 90s }
barriers:
  - name: bullmq-idle
    bullmq: { service: redis, queues: [emails] }
  - name: sidekiq-idle
    sidekiq: { service: redis }
  - name: celery-idle
    celery: { service: redis, worker: { service: celery, app: celery_tasks, restart_on_jump: true } }
