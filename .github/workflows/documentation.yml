name: docs

on:
  pull_request:
    paths: ["**/*.md", ".github/workflows/documentation.yml"]
  push:
    branches: [main]
    paths: ["**/*.md", ".github/workflows/documentation.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: Internal link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # --offline: checks relative links and files only (no network), so the job
      # is deterministic. External URLs are reviewed manually per
      # docs/SOURCE_VERIFICATION.md.
      - name: Check Markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --include-fragments './**/*.md'
          fail: true
