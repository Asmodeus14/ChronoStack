name: npm

# Publishes the Node SDK (sdk/node, package `chronostack`) to npm when a
# release is published, through npm trusted publishing: GitHub Actions proves
# its identity with OIDC (configured on npmjs.com for this repository and this
# workflow file), so no npm token is stored. Provenance is attached automatically.
# NPM_TOKEN, if still set, is only a fallback while trusted publishing is new.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Pack and check only, don't publish
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/node
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: npm with trusted publishing (11.5.1 or later)
        run: npm install -g npm@11.6.2 && npm --version
      - name: Version matches the release
        if: github.event_name == 'release'
        run: |
          want="${GITHUB_REF_NAME#v}"
          have=$(node -p "require('./package.json').version")
          echo "release $want, package $have"
          test "$want" = "$have"
      - run: npm test
      - run: npm pack --dry-run
      - name: Publish
        if: github.event_name == 'release' || !inputs.dry_run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          v=$(node -p "require('./package.json').version")
          if npm view "chronostack@$v" version >/dev/null 2>&1; then
            echo "chronostack@$v is already on npm"
            exit 0
          fi
          npm publish --access public --provenance --tag latest
