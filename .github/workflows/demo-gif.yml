name: demo-gif

# Renders docs/assets/{quickstart,scenario,failure}.gif from docs/assets/tapes/ against a real demo
# stack, and uploads it as an artifact. Commit the GIF by hand after checking it.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: docker build -f docker/clockd.Dockerfile -t chronostack/clockd:dev .
      - run: |
          cargo build -p chronostack
          echo "$GITHUB_WORKSPACE/target/debug" >> "$GITHUB_PATH"
      - name: Start the demo (not recorded)
        working-directory: examples/saas-trial-demo
        run: chronostack up --wait --wait-timeout 240s
      - uses: charmbracelet/vhs-action@v2
        with:
          path: docs/assets/tapes/quickstart.tape
      - uses: charmbracelet/vhs-action@v2
        with:
          path: docs/assets/tapes/scenario.tape
      - name: Restart the demo with the deliberate bug (not recorded)
        working-directory: examples/saas-trial-demo
        run: |
          chronostack down -v
          chronostack -f compose.yml -f compose.bug.yml up --wait --wait-timeout 240s
      - uses: charmbracelet/vhs-action@v2
        with:
          path: docs/assets/tapes/failure.tape
      - name: What the recording shell printed
        if: always()
        run: cat /tmp/demo-run.log || echo "(no log)"
      - name: Stop the demo
        if: always()
        working-directory: examples/saas-trial-demo
        run: chronostack down -v
      - uses: actions/upload-artifact@v7
        with:
          name: demo-gif
          path: docs/assets/*.gif
