name: ci

# Skeleton for future Rust + integration testing.
# No code exists yet: the `rust` job only runs once a Cargo workspace (Cargo.toml) exists,
# so this workflow never reports tests that do not exist.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect:
    name: Detect project components
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.check.outputs.rust }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -f Cargo.toml ]; then echo "rust=true" >> "$GITHUB_OUTPUT"; else echo "rust=false" >> "$GITHUB_OUTPUT"; fi

  rust:
    name: Rust (fmt, clippy, test)
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # Planned (add when the corresponding code exists — see docs/TESTING_STRATEGY.md):
  # - shim: build libchronoclock for x86_64/aarch64 × glibc/musl and run C tests in containers
  # - integration: Docker-based tests (clock consistency, no-hang suite, Postgres/Redis matrix)
  # - nightly: runtime + scheduler compatibility matrix
