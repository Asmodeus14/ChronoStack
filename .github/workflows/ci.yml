name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # clockd's tests (clock page writer, seqlock stress) are Linux-only.
      - run: cargo test --workspace

  msrv:
    name: MSRV (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  e2e:
    name: End-to-end (${{ matrix.os }})
    # Real Docker on native Linux: x86_64 and arm64 (covers M0 open items 2 and 3).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build clockd image (runs clockd unit tests inside)
        run: docker build -f docker/clockd.Dockerfile -t chronostack/clockd:dev .
      - name: Build CLI
        run: cargo build -p chronostack
      - name: Run e2e (M1 — controller, CLI, doctor)
        run: python3 tests/e2e/run_m1.py --skip-image-build --cli target/debug/chronostack
      - name: Run e2e (M2 — demo lifecycle, pg_cron sub-stepping)
        run: python3 tests/e2e/run_m2.py --cli target/debug/chronostack
