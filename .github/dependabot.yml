version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # `dtolnay/rust-toolchain@1.85` is the MSRV check, not an outdated version.
      - dependency-name: "dtolnay/rust-toolchain"

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"

  # Add when sdk/node/package.json exists (M4):
  # - package-ecosystem: "npm"
  #   directory: "/sdk/node"
  #   schedule: { interval: "weekly" }
