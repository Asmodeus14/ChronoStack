[package]
name = "chronostack"
description = "Stripe Test Clocks for your Docker Compose stack"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["testing", "time", "docker-compose", "faketime", "devtools"]
categories = ["development-tools::testing", "command-line-utilities"]
publish = false

[[bin]]
name = "chronostack"
path = "src/main.rs"

[dependencies]
chronostack-core.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
clap = { version = "4", features = ["derive", "env"] }
getrandom = "0.4"
ureq = { version = "3", default-features = false, features = ["json", "rustls"] }
# `chronostack update`
semver = "1"
sha2 = "0.10"
flate2 = "1"
tar = { version = "0.4", default-features = false }
zip = { version = "2", default-features = false, features = ["deflate"] }
self-replace = "1"
serde_norway = "0.9"
regex = { version = "1", default-features = false, features = ["std", "unicode-case", "unicode-perl"] }

[lints]
workspace = true
