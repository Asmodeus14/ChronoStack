version: 1
name: Monthly "Nth weekday" recurring tasks, as Worklenz 3.3.1 behaves today
description: >-
  Two recurring tasks created with Worklenz's own database functions:
  "Team sync", monthly on the 1st Monday (first due Monday 7 December 2026),
  and "Release review", monthly on the 2nd Tuesday (first due Tuesday 8
  December 2026). The recurring-task job (ENABLE_RECURRING_JOBS, every minute
  here) creates the next task once the last one is past due. Each stop lands at
  noon UTC and waits 75 s so the job runs. January 2027 starts on a Friday, the
  case where moment's .day() lands in the previous week.

steps:
  - name: 8 December 2026, noon UTC (Team sync's 7 December task is past)
    advance: { to: "2026-12-08T12:00:00Z", dwell: 75s }

  - name: the next "1st Monday" task is due Monday 28 December (still December), not 4 January
    assert: { sql: { service: db, user: postgres, database: worklenz_db, query: "select string_agg(to_char(end_date, 'YYYY-MM-DD'), ',' order by end_date) from tasks where name = 'Team sync (1st Monday)'", equals: "2026-12-07,2026-12-28" } }

  - name: 9 December 2026, noon UTC (Release review's 8 December task is past)
    advance: { to: "2026-12-09T12:00:00Z", dwell: 75s }

  - name: the next "2nd Tuesday" task is due 5 January (the 1st Tuesday), not 12 January
    assert: { sql: { service: db, user: postgres, database: worklenz_db, query: "select string_agg(to_char(end_date, 'YYYY-MM-DD'), ',' order by end_date) from tasks where name = 'Release review (2nd Tuesday)'", equals: "2026-12-08,2027-01-05" } }

  - name: 29 December 2026, noon UTC (the 28 December task is past)
    advance: { to: "2026-12-29T12:00:00Z", dwell: 75s }

  - name: 2 February 2027, noon UTC (after the 1st Mondays of January and February)
    advance: { to: "2027-02-02T12:00:00Z", dwell: 75s }

  - name: the schedule is stuck - no task for January (4 Jan) or February (1 Feb) was ever created
    assert: { sql: { service: db, user: postgres, database: worklenz_db, query: "select string_agg(to_char(end_date, 'YYYY-MM-DD'), ',' order by end_date) from tasks where name = 'Team sync (1st Monday)'", equals: "2026-12-07,2026-12-28" } }
