[workspace]
resolver = "3"
members = ["crates/core", "crates/clockd", "crates/cli", "crates/users"]

[workspace.package]
version = "0.1.0-alpha.7"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Asmodeus14/ChronoStack"
homepage = "https://chronostack-dev.vercel.app"
authors = ["The ChronoStack Contributors"]

[workspace.dependencies]
# The exact version is needed to publish to crates.io; bump it with the workspace version.
chronostack-core = { path = "crates/core", version = "=0.1.0-alpha.7" }
chronostack-users = { path = "crates/users", version = "=0.1.0-alpha.7" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
strip = true
