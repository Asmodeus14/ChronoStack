# SPDX-License-Identifier: MIT OR Apache-2.0
# B1 clock-read overhead. Each runtime image also has Debian's libfaketime, so
# native, ChronoStack and libfaketime are measured in the same container: the
# harness only changes LD_PRELOAD (and FAKETIME variables) per run.
name: bench-clock
services:
  c:
    build:
      context: .
      dockerfile_inline: |
        FROM debian:bookworm-slim
        RUN apt-get update && apt-get install -y --no-install-recommends gcc libc6-dev faketime && rm -rf /var/lib/apt/lists/*
        COPY clockbench.c /src/
        RUN gcc -O2 -Wall -o /usr/local/bin/clockbench /src/clockbench.c
    command: ["sleep", "infinity"]
  python:
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.12-slim-bookworm
        RUN apt-get update && apt-get install -y --no-install-recommends faketime && rm -rf /var/lib/apt/lists/*
        COPY clockbench.py /b/
    command: ["sleep", "infinity"]
  node:
    build:
      context: .
      dockerfile_inline: |
        FROM node:22-bookworm-slim
        RUN apt-get update && apt-get install -y --no-install-recommends faketime && rm -rf /var/lib/apt/lists/*
        COPY clockbench.js /b/
    command: ["sleep", "infinity"]
